<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Background focus fixture</title>
    <style>
      body { background: #ececec; font: 16px system-ui, sans-serif; padding: 2rem; }
      button { background: #fff; border: 4px solid #111; color: #111; outline: none; padding: .75rem 1rem; }
      button:focus { background: #111; color: #fff; outline: none; }
    </style>
  </head>
  <body>
    <button id="background-focus">Background focus</button>
  </body>
</html>
